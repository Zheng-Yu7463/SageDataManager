log_format sage_main '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';
limit_req_zone $binary_remote_addr zone=sage_auth:10m rate=10r/m;
server_tokens off;

server {
    listen 80;
    server_name _;

    # Metadata and authentication requests should never need large request bodies.
    client_max_body_size 2m;
    access_log /var/log/nginx/access.log sage_main;
    limit_req_status 429;
    include /etc/nginx/snippets/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    location ~ "^/api/(health|ready)$" {
        access_log off;
        proxy_pass http://backend:8000;
        include /etc/nginx/snippets/proxy.conf;
    }

    location = /api/auth/login {
        limit_req zone=sage_auth burst=10 nodelay;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000;
        include /etc/nginx/snippets/proxy.conf;
    }

    location = /api/auth/setup {
        limit_req zone=sage_auth burst=3 nodelay;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000;
        include /etc/nginx/snippets/proxy.conf;
    }

    location = /api/auth/invitations {
        limit_req zone=sage_auth burst=10 nodelay;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000;
        include /etc/nginx/snippets/proxy.conf;
    }

    location = /api/auth/invitations/accept {
        limit_req zone=sage_auth burst=5 nodelay;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Compatibility for invitations issued before tokens moved into URL fragments.
    location ~ "^/api/auth/invitations/[A-Za-z0-9_-]{60,100}(/accept)?$" {
        access_log off;
        error_log /dev/null crit;
        limit_req zone=sage_auth burst=5 nodelay;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000;
        include /etc/nginx/snippets/proxy.conf;
    }

    location = /api/settings/system-update/apply {
        limit_req zone=sage_auth burst=5 nodelay;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ~ "^/api/files/[0-9a-fA-F-]{36}/content$" {
        error_log /dev/null crit;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://backend:8000;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ~ "^/api/agent/uploads/[0-9a-fA-F-]{36}/files/" {
        client_max_body_size 500m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://backend:8000;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/ {
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://backend:8000;
        include /etc/nginx/snippets/proxy.conf;
    }

    location = /agent.md {
        proxy_pass http://backend:8000/agent.md;
        include /etc/nginx/snippets/proxy.conf;
    }

    location = /.well-known/datamanager-agent.json {
        proxy_pass http://backend:8000/.well-known/datamanager-agent.json;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ~ "^/register/[A-Za-z0-9_-]{60,100}$" {
        access_log off;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }
}
