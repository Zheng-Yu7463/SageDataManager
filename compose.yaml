name: sage-data-manager

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sage}
      POSTGRES_USER: ${POSTGRES_USER:-sage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - sage-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sage} -d ${POSTGRES_DB:-sage}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    restart: unless-stopped
    build:
      context: ./backend
      args:
        PYPI_INDEX_URL: ${SAGE_PYPI_INDEX_URL:-https://pypi.org/simple}
        PYPI_TIMEOUT: ${SAGE_PYPI_TIMEOUT:-120}
        PYPI_RETRIES: ${SAGE_PYPI_RETRIES:-3}
        SAGE_RELEASE_COMMIT: ${SAGE_RELEASE_COMMIT:-unknown}
    environment:
      SAGE_DATABASE_HOST: postgres
      SAGE_DATABASE_PORT: 5432
      SAGE_DATABASE_NAME: ${POSTGRES_DB:-sage}
      SAGE_DATABASE_USER: ${POSTGRES_USER:-sage}
      SAGE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      SAGE_UPLOAD_SSH_HOST: ${SAGE_UPLOAD_SSH_HOST:-192.168.1.213}
      SAGE_UPLOAD_SSH_PORT: ${SAGE_UPLOAD_SSH_PORT:-22}
      SAGE_UPLOAD_DESTINATION_ROOT: ${SAGE_UPLOAD_DESTINATION_ROOT:-/home/zhengyu/SageDataManager/sample-archive}
      SAGE_ALLOWED_ORIGINS: '${SAGE_ALLOWED_ORIGINS:-["http://localhost:5173"]}'
      SAGE_FIXED_ACCOUNT_PASSWORD: ${SAGE_FIXED_ACCOUNT_PASSWORD:-}
      SAGE_AUTH_SESSION_SECRET: ${SAGE_AUTH_SESSION_SECRET:-}
      SAGE_AUTH_SESSION_TTL_SECONDS: ${SAGE_AUTH_SESSION_TTL_SECONDS:-43200}
      SAGE_ACCOUNT_INVITATION_TTL_SECONDS: ${SAGE_ACCOUNT_INVITATION_TTL_SECONDS:-604800}
      SAGE_FILE_ACCESS_TTL_SECONDS: ${SAGE_FILE_ACCESS_TTL_SECONDS:-120}
      SAGE_UPLOAD_TICKET_TTL_SECONDS: ${SAGE_UPLOAD_TICKET_TTL_SECONDS:-86400}
      SAGE_AGENT_UPLOAD_MAX_BYTES: ${SAGE_AGENT_UPLOAD_MAX_BYTES:-500000000}
      SAGE_AGENT_TOKEN_LAST_USED_INTERVAL_SECONDS: ${SAGE_AGENT_TOKEN_LAST_USED_INTERVAL_SECONDS:-300}
      SAGE_UPDATE_AGENT_SOCKET: /run/sage-updater/updater.sock
      SAGE_UPDATE_AGENT_SECRET: ${SAGE_UPDATE_AGENT_SECRET:-}
      SAGE_UPDATE_AGENT_TIMEOUT_SECONDS: ${SAGE_UPDATE_AGENT_TIMEOUT_SECONDS:-60}
      SAGE_STORAGE_ROOT: /data/sage-archive
    volumes:
      - ${SAGE_STORAGE_ROOT:-./sample-archive}:/data/sage-archive
      - /run/sage-updater:/run/sage-updater:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        SAGE_RELEASE_COMMIT: ${SAGE_RELEASE_COMMIT:-unknown}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  sage-postgres-data:
